apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: backend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - env:
            - name: ConnectionStrings__Default
              value: Host=database;Port=5432;Database=tabloid;Username=postgres;Password=yourpassword
          image: ghcr.io/businessbiggie/ca-backend:latest
          imagePullPolicy: Always
          name: backend
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
