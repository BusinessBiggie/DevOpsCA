name: Backend Check
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore packages
        run: dotnet restore backend/DevOps_CA.sln
      - name: Check build
        run: dotnet build backend/DevOps_CA.sln --no-restore
  
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore packages
        run: dotnet restore backend/DevOps_CA.sln
      - name: Check formatting
        run: dotnet format backend/DevOps_CA.sln --verify-no-changes

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore packages
        run: dotnet restore backend/DevOps_CA.sln
      - name: Run tests
        run: dotnet test backend/DevOps_CA.sln --no-restore --verbosity normal
