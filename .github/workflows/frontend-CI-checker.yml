name: Frontend Check

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install packages
      run: |
        cd frontend
        npm install
      
    - name: Check build
      run: |
        cd frontend
        npm run build

  lint:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install packages
      run: |
        cd frontend
        npm install
      
    - name: Check linting
      run: |
        cd frontend
        npm run lint